<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperbaric WOB Simulator v4.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; background-color: #020617; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 1. 图标组件 ---
        const IconBase = ({ children, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>{children}</svg>
        );
        const Activity = (p) => <IconBase {...p}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconBase>;
        const Wind = (p) => <IconBase {...p}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></IconBase>;
        const Grid = (p) => <IconBase {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></IconBase>;
        const Gauge = (p) => <IconBase {...p}><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></IconBase>;
        const Droplets = (p) => <IconBase {...p}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.8-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6c2.2 0 4.06-1.83 4.06-4.05 0-1.16-.57-2.26-1.71-3.19S12.85-2.75 12.56-4.2c-.29 1.45-1.14 2.8-2.29 3.76S8.5 1.1 8.5 2.25c0 2.22 1.82 4.05 4.06 4.05z"/><path d="M16.5 10.5c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S16.79.95 16.5-.5c-.29 1.45-1.14 2.8-2.29 3.76s-1.71 2.04-1.71 3.19c0 2.22 1.8 4.05 4 4.05z"/></IconBase>;
        const Waves = (p) => <IconBase {...p}><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></IconBase>;

        // --- 2. 翻译与常量 ---
        const translations = {
            en: {
                title: "Hyperbaric WOB Simulator", // 已修改
                subtitle: "Depth-Variable Resistance Analysis v4.5",
                systemArch: "CCR Educational Tool",
                developedBy: "Developed By",
                envSettings: "Environment Control",
                gasType: "Gas Mixture",
                meshSize: "Sorbent Mesh",
                depth: "Depth (msw)",
                rmv: "RMV (L/min)",
                physicsStats: "Physics Telemetry",
                density: "Gas Density",
                reynolds: "Reynolds No.",
                flowState: "Flow Regime",
                pressureDrop: "Total WOB (ΔP)",
                wobStatus: "Breathing Effort",
                viscous: "Viscous Term",
                inertial: "Inertial Term",
                laminar: "Laminar",
                transition: "Transition",
                turbulent: "Turbulent",
                relaxed: "RELAXED",
                noticeable: "NOTICEABLE",
                labored: "LABORED",
                critical: "CRITICAL",
                mesh812: "8-12 Grade",
                mesh408: "4-8 Grade",
                chartX: "Velocity (m/s)"
            },
            zh: {
                title: "高压环境WOB模拟器", // 已修改
                subtitle: "变深度呼吸阻力物理仿真 v4.5",
                systemArch: "CCR教学演示工具",
                developedBy: "系统开发",
                envSettings: "环境参数控制",
                gasType: "气体类型",
                meshSize: "吸附剂目数",
                depth: "潜水深度 (米)",
                rmv: "呼吸通气量 (L/min)",
                physicsStats: "物理遥测数据",
                density: "气体密度 (ρ)",
                reynolds: "雷诺数 (Re)",
                flowState: "流体状态",
                pressureDrop: "总呼吸阻力 (ΔP)",
                wobStatus: "呼吸阻力体感",
                viscous: "粘性损耗 (线性)",
                inertial: "惯性碰撞 (平方)",
                laminar: "层流 (Laminar)",
                transition: "过渡区 (Transition)",
                turbulent: "湍流 (Turbulent)",
                relaxed: "轻松 (RELAXED)",
                noticeable: "略沉 (NOTICEABLE)",
                labored: "吃力 (LABORED)",
                critical: "危险 (CRITICAL)",
                mesh812: "8-12 目 (标准)",
                mesh408: "4-8 目 (大颗粒)",
                chartX: "流速 Velocity (m/s)"
            },
            jp: {
                title: "高圧環境WOBシミュレーター", // 已修改
                subtitle: "深度可変呼吸抵抗解析 v4.5",
                systemArch: "CCR教育用ツール",
                developedBy: "開発者",
                envSettings: "環境設定",
                gasType: "ガス種類",
                meshSize: "メッシュサイズ",
                depth: "深度 (m)",
                rmv: "呼吸量 (RMV)",
                physicsStats: "物理テレメトリ",
                density: "ガス密度",
                reynolds: "レイノルズ数",
                flowState: "流体状態",
                pressureDrop: "全呼吸抵抗 (ΔP)",
                wobStatus: "呼吸抵抗感",
                viscous: "粘性項",
                inertial: "慣性項",
                laminar: "層流",
                transition: "遷移域",
                turbulent: "乱流",
                relaxed: "快適",
                noticeable: "普通",
                labored: "重い",
                critical: "危険",
                mesh812: "8-12 メッシュ",
                mesh408: "4-8 メッシュ",
                chartX: "流速 Velocity (m/s)"
            }
        };

        // --- 3. 物理引擎 (核心算法) ---
        const VISCOSITY = 1.8e-5; 
        const POROSITY = 0.4; 
        const SCRUBBER_AREA = 0.015;
        const meshDiameters = { '812': 0.0022, '408': 0.0040 };

        const getBaseDensity = (type) => {
            if (type === 'h2') return 0.25;
            if (type === 'he') return 0.45;
            if (type === 'tmx') return 0.60;
            return 1.2;
        };

        const calculatePhysics = (depth, rmv, gasType, meshType) => {
            const rho = getBaseDensity(gasType) * ((depth / 10) + 1);
            const v = (rmv / 60000) / SCRUBBER_AREA; // Velocity in m/s
            const mu = VISCOSITY;
            const eps = POROSITY;
            const dp = meshDiameters[meshType];

            // Ergun Equation Terms
            const t1 = (150 * mu * Math.pow(1 - eps, 2)) / (Math.pow(dp, 2) * Math.pow(eps, 3));
            const t2 = (1.75 * rho * (1 - eps)) / (dp * Math.pow(eps, 3));
            
            const vTerm = t1 * v;
            const iTerm = t2 * v * v;
            const total = vTerm + iTerm;
            const re = (rho * v * dp) / (mu * (1 - eps));

            return { vTerm, iTerm, total, re, rho, velocity: v };
        };

        // --- 4. 主组件 ---
        const App = () => {
            const [lang, setLang] = useState('zh');
            const [depth, setDepth] = useState(100);
            const [rmv, setRmv] = useState(20);
            const [gas, setGas] = useState('air');
            const [mesh, setMesh] = useState('812');
            
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const t = translations[lang];

            // 计算当前状态
            const stats = useMemo(() => calculatePhysics(depth, rmv, gas, mesh), [depth, rmv, gas, mesh]);

            // 状态颜色逻辑
            const getStatusColor = (val) => {
                if (val < 300) return { text: "text-emerald-400", bg: "bg-emerald-500", border: "border-emerald-500", label: t.relaxed };
                if (val < 600) return { text: "text-blue-400", bg: "bg-blue-500", border: "border-blue-500", label: t.noticeable };
                if (val < 1000) return { text: "text-orange-400", bg: "bg-orange-500", border: "border-orange-500", label: t.labored };
                return { text: "text-rose-400", bg: "bg-rose-500", border: "border-rose-500", label: t.critical };
            };
            const statusStyle = getStatusColor(stats.total);

            // Chart.js 更新逻辑
            useEffect(() => {
                const ctx = chartRef.current.getContext('2d');
                
                // 生成曲线数据点 (Velocity 0 to 0.4 m/s)
                const curveData = Array.from({length: 41}, (_, i) => {
                    const v = i * 0.01;
                    const sim = calculatePhysics(depth, v * 60000 * SCRUBBER_AREA, gas, mesh); // 反推 RMV 进行计算有点绕，直接重算压力
                    
                    // 手动重算压力 (为了曲线平滑，不依赖组件状态的RMV)
                    const rho = getBaseDensity(gas) * ((depth / 10) + 1);
                    const dp = meshDiameters[mesh];
                    const t1 = (150 * VISCOSITY * Math.pow(1 - POROSITY, 2)) / (Math.pow(dp, 2) * Math.pow(1 - POROSITY, 3)); // Bugfix: use constant
                    // 简化：直接复用逻辑
                    const mu = VISCOSITY; const eps = POROSITY;
                    const k1 = (150 * mu * Math.pow(1 - eps, 2)) / (Math.pow(dp, 2) * Math.pow(eps, 3));
                    const k2 = (1.75 * rho * (1 - eps)) / (dp * Math.pow(eps, 3));
                    return { x: v, y: k1 * v + k2 * v * v };
                });

                const config = {
                    type: 'line',
                    data: {
                        datasets: [
                            {
                                label: 'Profile',
                                data: curveData,
                                borderColor: '#0ea5e9', // Sky-500
                                borderWidth: 2,
                                tension: 0.4,
                                pointRadius: 0,
                                fill: true,
                                backgroundColor: 'rgba(14, 165, 233, 0.1)'
                            },
                            {
                                label: 'Current Point',
                                data: [{x: stats.velocity, y: stats.total}],
                                type: 'scatter',
                                pointRadius: 8,
                                pointBackgroundColor: stats.total > 1000 ? '#f43f5e' : '#ffffff',
                                pointBorderColor: stats.total > 1000 ? 'white' : '#0ea5e9',
                                pointBorderWidth: 3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: { duration: 400 },
                        scales: {
                            x: { 
                                type: 'linear', min: 0, max: 0.4, 
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: '#64748b' },
                                title: { display: true, text: t.chartX, color: '#475569' }
                            },
                            y: { 
                                beginAtZero: true, max: 2000, 
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: '#64748b' },
                                title: { display: true, text: 'Pa/m', color: '#475569' }
                            }
                        },
                        plugins: { legend: { display: false }, tooltip: { enabled: false } }
                    }
                };

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }
                chartInstance.current = new Chart(ctx, config);

                return () => { if(chartInstance.current) chartInstance.current.destroy(); };
            }, [depth, gas, mesh, stats, lang]);

            return (
                <div className="bg-[#020617] text-slate-300 min-h-screen font-sans selection:bg-sky-500/30 flex flex-col overflow-hidden">
                    
                    {/* Header */}
                    <header className="h-20 border-b border-white/5 flex items-center justify-between px-10 shrink-0 relative bg-slate-900/40 backdrop-blur-md z-50">
                        <div className="flex items-center gap-6">
                            <div className="flex flex-col">
                                <span className="text-xs font-black tracking-[0.3em] text-sky-500/60 uppercase leading-none mb-1">{t.systemArch}</span>
                                <div className="flex items-center gap-3">
                                    <span className="text-2xl font-black text-white tracking-tight uppercase">{t.title}</span>
                                    <div className="px-2 py-0.5 rounded-full border border-sky-500/30 bg-sky-500/10 text-[10px] font-bold text-sky-400">v4.5</div>
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center gap-8">
                            <div className="flex bg-black/40 p-1 rounded-lg border border-white/5 gap-1">
                                {['zh', 'en', 'jp'].map(l => (
                                    <button key={l} onClick={() => setLang(l)} className={`px-4 py-1.5 rounded text-xs font-black uppercase transition-all ${lang === l ? 'bg-sky-600 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}>{l}</button>
                                ))}
                            </div>
                            <div className="flex flex-col items-end hidden sm:flex">
                                <span className="text-xs font-black tracking-[0.3em] text-slate-500 uppercase mb-1">{t.developedBy}</span>
                                <div className="flex items-center gap-2">
                                    <span className="text-sm font-black text-white tracking-widest uppercase">POWERGX Inc. Myron Yu</span>
                                    <span className="text-xs font-bold text-sky-500 opacity-70">Aka. 雪夜叉</span>
                                </div>
                            </div>
                        </div>
                        <div className="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-sky-500/30 to-transparent"></div>
                    </header>

                    <main className="flex-1 flex flex-col lg:flex-row overflow-hidden">
                        
                        {/* 左侧控制面板 */}
                        <aside className="lg:w-[400px] border-r border-white/5 bg-slate-900/20 p-8 flex flex-col gap-6 overflow-y-auto shrink-0 scrollbar-hide">
                            
                            {/* 气体选择 */}
                            <section className="space-y-3">
                                <div className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-1 flex items-center gap-2"><Wind size={12}/> {t.gasType}</div>
                                <div className="grid grid-cols-2 gap-2">
                                    {['air', 'tmx', 'he', 'h2'].map(g => (
                                        <button key={g} onClick={() => setGas(g)} className={`py-3 px-2 rounded-xl text-[10px] font-bold uppercase transition-all border ${gas === g ? 'bg-slate-700 text-white border-sky-500/50 shadow-lg' : 'bg-black/20 text-slate-500 border-white/5 hover:border-white/10'}`}>
                                            {g === 'air' ? 'AIR' : g === 'tmx' ? 'TRIMIX' : g === 'he' ? 'HELIOX' : 'HYDROX'}
                                        </button>
                                    ))}
                                </div>
                            </section>

                             {/* 颗粒选择 */}
                             <section className="space-y-3">
                                <div className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-1 flex items-center gap-2"><Grid size={12}/> {t.meshSize}</div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => setMesh('812')} className={`py-3 px-2 rounded-xl text-[10px] font-bold uppercase transition-all border ${mesh === '812' ? 'bg-slate-700 text-white border-sky-500/50 shadow-lg' : 'bg-black/20 text-slate-500 border-white/5 hover:border-white/10'}`}>{t.mesh812}</button>
                                    <button onClick={() => setMesh('408')} className={`py-3 px-2 rounded-xl text-[10px] font-bold uppercase transition-all border ${mesh === '408' ? 'bg-slate-700 text-white border-sky-500/50 shadow-lg' : 'bg-black/20 text-slate-500 border-white/5 hover:border-white/10'}`}>{t.mesh408}</button>
                                </div>
                            </section>

                            {/* 滑块控制 */}
                            <section className="space-y-6 pt-2">
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center px-1">
                                        <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">{t.depth}</span>
                                        <span className="text-sky-400 font-mono font-bold text-sm">{depth}m</span>
                                    </div>
                                    <input type="range" min="0" max="300" value={depth} onChange={(e) => setDepth(parseInt(e.target.value))} className="w-full h-1 bg-black/50 rounded-lg appearance-none cursor-pointer accent-sky-500" />
                                </div>

                                <div className="space-y-3">
                                    <div className="flex justify-between items-center px-1">
                                        <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">{t.rmv}</span>
                                        <span className="text-sky-400 font-mono font-bold text-sm">{rmv} L/min</span>
                                    </div>
                                    <input type="range" min="10" max="80" value={rmv} onChange={(e) => setRmv(parseInt(e.target.value))} className="w-full h-1 bg-black/50 rounded-lg appearance-none cursor-pointer accent-sky-500" />
                                </div>
                            </section>

                            {/* 物理遥测数据 (底部) */}
                            <div className="mt-auto p-5 rounded-2xl bg-black/20 border border-white/5 flex flex-col gap-3">
                                <div className="text-[10px] font-black uppercase tracking-widest text-slate-500 flex items-center gap-2 mb-1">
                                    <Activity size={12}/> {t.physicsStats}
                                </div>
                                <div className="flex justify-between items-center border-b border-white/5 pb-2">
                                    <span className="text-xs text-slate-400">{t.density}</span>
                                    <span className="font-mono text-sm text-white">{stats.rho.toFixed(2)} <span className="text-xs text-slate-600">kg/m³</span></span>
                                </div>
                                <div className="flex justify-between items-center border-b border-white/5 pb-2">
                                    <span className="text-xs text-slate-400">{t.reynolds}</span>
                                    <span className="font-mono text-sm text-sky-400">{Math.round(stats.re)}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-xs text-slate-400">{t.flowState}</span>
                                    <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded ${stats.re < 10 ? 'bg-emerald-500/10 text-emerald-400' : stats.re < 280 ? 'bg-orange-500/10 text-orange-400' : 'bg-rose-500/10 text-rose-400'}`}>
                                        {stats.re < 10 ? t.laminar : stats.re < 280 ? t.transition : t.turbulent}
                                    </span>
                                </div>
                            </div>
                        </aside>

                        {/* 右侧主视窗 */}
                        <section className="flex-1 relative flex flex-col bg-[#020617] p-4 lg:p-8 overflow-hidden">
                            
                            {/* 背景光效 */}
                            <div className="absolute inset-0 pointer-events-none">
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-sky-500/5 blur-[160px] rounded-full"></div>
                                <div className="absolute top-0 right-0 w-96 h-96 bg-blue-500/5 blur-[100px]"></div>
                            </div>

                            {/* 顶部 HUD：大数字显示 */}
                            <div className="z-10 w-full grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div className={`relative p-6 rounded-3xl border backdrop-blur-md transition-all duration-500 ${statusStyle.bg}/10 ${statusStyle.border}/30 group overflow-hidden`}>
                                    <div className="relative z-10">
                                        <div className="flex items-center gap-2 text-slate-400 mb-2">
                                            <Gauge size={16} className={statusStyle.text}/>
                                            <span className="text-[10px] font-black uppercase tracking-widest">{t.pressureDrop}</span>
                                        </div>
                                        <div className={`text-6xl font-black font-mono tracking-tighter ${statusStyle.text}`}>
                                            {stats.total.toFixed(0)} <span className="text-2xl text-slate-600 font-bold opacity-50">Pa/m</span>
                                        </div>
                                        <div className={`mt-2 inline-block px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest ${statusStyle.bg} text-white`}>
                                            {statusStyle.label}
                                        </div>
                                    </div>
                                    {/* 装饰性背景 */}
                                    <Activity className={`absolute right-[-20px] bottom-[-20px] w-48 h-48 opacity-5 ${statusStyle.text}`} />
                                </div>

                                <div className="grid grid-cols-1 gap-4">
                                    {/* 粘性损耗 */}
                                    <div className="p-4 rounded-2xl bg-blue-500/5 border border-blue-500/20 flex justify-between items-center relative overflow-hidden">
                                        <div className="z-10">
                                            <div className="text-[10px] text-blue-400 font-black uppercase tracking-widest mb-1">{t.viscous}</div>
                                            <div className="text-2xl font-mono text-white">{stats.vTerm.toFixed(1)} <span className="text-xs text-slate-600">Pa</span></div>
                                        </div>
                                        <div className="z-10 w-24 h-1 bg-slate-800 rounded-full overflow-hidden">
                                            <div className="h-full bg-blue-500 transition-all duration-300" style={{width: `${(stats.vTerm/stats.total)*100}%`}}></div>
                                        </div>
                                        <Waves className="absolute right-4 top-1/2 -translate-y-1/2 text-blue-500/10 w-16 h-16" />
                                    </div>

                                    {/* 惯性损耗 */}
                                    <div className="p-4 rounded-2xl bg-rose-500/5 border border-rose-500/20 flex justify-between items-center relative overflow-hidden">
                                        <div className="z-10">
                                            <div className="text-[10px] text-rose-400 font-black uppercase tracking-widest mb-1">{t.inertial}</div>
                                            <div className="text-2xl font-mono text-white">{stats.iTerm.toFixed(1)} <span className="text-xs text-slate-600">Pa</span></div>
                                        </div>
                                        <div className="z-10 w-24 h-1 bg-slate-800 rounded-full overflow-hidden">
                                            <div className="h-full bg-rose-500 transition-all duration-300" style={{width: `${(stats.iTerm/stats.total)*100}%`}}></div>
                                        </div>
                                        <Wind className="absolute right-4 top-1/2 -translate-y-1/2 text-rose-500/10 w-16 h-16" />
                                    </div>
